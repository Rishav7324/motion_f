name: Build MotionF Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter doctor -v
          cmake --version
          java -version

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Dart & Flutter Unit Tests
        run: flutter test --no-pub

      - name: Build Android Release APK (ARM64 & Universal)
        run: flutter build apk --release --split-per-abi

      - name: Upload ARM64-v8a APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionF-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14

      - name: Upload armeabi-v7a APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionF-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 14

      - name: Upload Universal Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionF-universal-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
